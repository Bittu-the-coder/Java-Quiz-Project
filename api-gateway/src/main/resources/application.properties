spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# Gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Disable MVC (force WebFlux)
spring.main.web-application-type=reactive

# Clean API route
spring.cloud.gateway.routes[0].id=auth-api
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Teacher-style route
spring.cloud.gateway.routes[1].id=auth-service-prefixed
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth-service/**

spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=quiz-service
spring.cloud.gateway.routes[2].uri=lb://quiz-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/quizzes/**


spring.cloud.gateway.routes[3].id=question-service
spring.cloud.gateway.routes[3].uri=lb://question-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/questions/**

spring.cloud.gateway.routes[4].id=result-service
spring.cloud.gateway.routes[4].uri=lb://result-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/results/**

spring.cloud.gateway.routes[5].id=attempts-service
spring.cloud.gateway.routes[5].uri=lb://result-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/attempts/**

spring.cloud.gateway.routes[6].id=org-api
spring.cloud.gateway.routes[6].uri=lb://auth-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/orgs/**

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service

springdoc.swagger-ui.urls[1].name=Quiz Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/quiz-service

springdoc.swagger-ui.urls[2].name=Question Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/question-service

springdoc.swagger-ui.urls[3].name=Result Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/result-service


spring.cloud.gateway.routes[7].id=auth-swagger
spring.cloud.gateway.routes[7].uri=lb://auth-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/auth-service,/v3/api-docs

spring.cloud.gateway.routes[8].id=quiz-swagger
spring.cloud.gateway.routes[8].uri=lb://quiz-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/quiz-service
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/quiz-service,/v3/api-docs

spring.cloud.gateway.routes[9].id=question-swagger
spring.cloud.gateway.routes[9].uri=lb://question-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/question-service
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/question-service,/v3/api-docs

spring.cloud.gateway.routes[10].id=result-swagger
spring.cloud.gateway.routes[10].uri=lb://result-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/result-service
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/result-service,/v3/api-docs
