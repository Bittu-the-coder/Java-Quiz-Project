services:
  postgres:
    image: postgres:16-alpine
    container_name: assessify-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student1}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assessify-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: assessify-service-registry
    restart: unless-stopped
    ports:
      - "${SERVICE_REGISTRY_PORT:-8761}:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: assessify-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://service-registry:8761/eureka}
    depends_on:
      service-registry:
        condition: service_started

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: assessify-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student1}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://service-registry:8761/eureka}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

  quiz-service:
    build:
      context: ./quiz-service
      dockerfile: Dockerfile
    container_name: assessify-quiz-service
    restart: unless-stopped
    ports:
      - "${QUIZ_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student1}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://service-registry:8761/eureka}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

  question-service:
    build:
      context: ./question-service
      dockerfile: Dockerfile
    container_name: assessify-question-service
    restart: unless-stopped
    ports:
      - "${QUESTION_SERVICE_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student1}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://service-registry:8761/eureka}
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started

  result-service:
    build:
      context: ./result-service
      dockerfile: Dockerfile
    container_name: assessify-result-service
    restart: unless-stopped
    ports:
      - "${RESULT_SERVICE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student1}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://service-registry:8761/eureka}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_started

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
